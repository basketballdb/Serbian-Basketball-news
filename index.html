<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtVision | Basketball News</title>
    <style>
        :root {
            --primary: #f26522; /* Basketball Orange */
            --dark: #222;
            --light: #f4f4f4;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--dark);
        }
        header {
            background-color: var(--dark);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        header h1 {
            margin: 0;
            color: var(--primary);
        }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .search-bar input {
            padding: 8px;
            border: none;
            border-radius: 4px;
        }
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        /* Admin Panel Styles */
        .admin-panel {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
        }
        .admin-panel h2 {
            margin-top: 0;
            color: var(--primary);
        }
        .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .admin-panel button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            width: 100%;
        }
        .admin-panel button:hover {
            background-color: #d15219;
        }
        /* News Feed Styles */
        .news-feed {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .news-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .news-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .news-content {
            padding: 1.5rem;
        }
        .news-content h3 {
            margin: 0 0 10px 0;
        }
        .news-meta {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 10px;
        }
        .tag {
            background: var(--primary);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
        }
        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏀 CourtVision News</h1>
        <div class="search-bar">
            <input type="date" id="searchDate" onchange="filterNews()">
            <input type="text" id="searchInput" placeholder="Search keywords or tags..." onkeyup="filterNews()">
        </div>
    </header>

    <div class="container">
        <aside class="admin-panel">
            <h2>Post an Article</h2>
            <input type="text" id="newsTitle" placeholder="Headline / Title" required>
            <input type="text" id="newsImage" placeholder="Image URL (e.g., https://...)" required>
            <textarea id="newsDesc" rows="5" placeholder="Write the news description here..." required></textarea>
            <input type="text" id="newsTags" placeholder="Tags (comma separated, e.g., NBA, Lakers)">
            <input type="date" id="newsDate" required>
            <button onclick="addNews()">Publish News</button>
        </aside>

        <main class="news-feed" id="newsFeed">
            </main>
    </div>

    <script>
        // 1. Initialize data from LocalStorage (or use empty array)
        let articles = JSON.parse(localStorage.getItem('basketballNews')) || [];

        // 2. Function to display news
        function displayNews(newsToDisplay) {
            const feed = document.getElementById('newsFeed');
            feed.innerHTML = ''; // Clear current feed

            if (newsToDisplay.length === 0) {
                feed.innerHTML = '<p>No news found matching your criteria.</p>';
                return;
            }

            // Sort by date (newest first)
            newsToDisplay.sort((a, b) => new Date(b.date) - new Date(a.date));

            newsToDisplay.forEach(article => {
                const tagsHTML = article.tags.map(tag => `<span class="tag">${tag.trim()}</span>`).join('');
                
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <img src="${article.image || 'https://via.placeholder.com/800x300?text=Basketball+News'}" alt="News Image" onerror="this.src='https://via.placeholder.com/800x300?text=Image+Not+Found'">
                    <div class="news-content">
                        <button class="delete-btn" onclick="deleteNews('${article.id}')">Delete</button>
                        <h3>${article.title}</h3>
                        <div class="news-meta">
                            <strong>Date:</strong> ${article.date} | 
                            <strong>Tags:</strong> ${tagsHTML}
                        </div>
                        <p>${article.description}</p>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        // 3. Function to Add News
        function addNews() {
            const title = document.getElementById('newsTitle').value;
            const image = document.getElementById('newsImage').value;
            const desc = document.getElementById('newsDesc').value;
            const tags = document.getElementById('newsTags').value.split(',').filter(t => t !== '');
            const date = document.getElementById('newsDate').value;

            if (!title || !desc || !date) {
                alert("Please fill in at least the Title, Description, and Date!");
                return;
            }

            const newArticle = {
                id: Date.now().toString(), // Unique ID
                title: title,
                image: image,
                description: desc,
                tags: tags,
                date: date
            };

            articles.push(newArticle);
            saveData();
            
            // Clear the form
            document.getElementById('newsTitle').value = '';
            document.getElementById('newsImage').value = '';
            document.getElementById('newsDesc').value = '';
            document.getElementById('newsTags').value = '';
            document.getElementById('newsDate').value = '';

            displayNews(articles);
        }

        // 4. Function to Delete News
        function deleteNews(id) {
            if(confirm("Are you sure you want to delete this article?")) {
                articles = articles.filter(article => article.id !== id);
                saveData();
                filterNews(); // Re-render with current filters
            }
        }

        // 5. Function to Save to LocalStorage
        function saveData() {
            localStorage.setItem('basketballNews', JSON.stringify(articles));
        }

        // 6. Search and Filter Function
        function filterNews() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const searchDate = document.getElementById('searchDate').value;

            const filteredArticles = articles.filter(article => {
                // Check text match (title, desc, or tags)
                const textMatch = article.title.toLowerCase().includes(searchText) || 
                                  article.description.toLowerCase().includes(searchText) ||
                                  article.tags.some(tag => tag.toLowerCase().includes(searchText));
                
                // Check date match
                const dateMatch = searchDate === '' || article.date === searchDate;

                return textMatch && dateMatch;
            });

            displayNews(filteredArticles);
        }

        // Initial Load
        // Set today's date in the admin form by default
        document.getElementById('newsDate').valueAsDate = new Date();
        displayNews(articles);
    </script>
</body>
</html>
